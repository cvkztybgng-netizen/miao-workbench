<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2E9E8F" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="miao的工作台">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<title>miao的工作台</title>
<link rel="stylesheet" href="./style.css">
  <script>window.__STATIC__=true;window.__GATE_PASS__="miao2026";</script>
</head>
<body>
<!--
  ServiceWorker：彻底关闭。
  本应用不注册任何 ServiceWorker，并主动卸载该域名下的残留 SW 与 Cache 存储，
  避免任何旧缓存导致页面更新不生效。
-->
<script>
  (function hardOffSW(){
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(rs){
          rs.forEach(function(r){ r.unregister(); });
        }).catch(function(){});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
      }
    } catch (e) {}
  })();
</script>

<!-- 登录页 -->
<div id="loginScreen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-logo" id="loginLogo">🦢</div>
    <div class="login-title" id="loginTitle">miao的工作台</div>
    <div class="login-sub">私有云端工作台 · 数据实时同步</div>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="loginPassword" placeholder="请输入访问密码" autocomplete="current-password" required>
      <button type="submit" class="btn primary block" id="loginBtn">进入工作台</button>
    </form>
    <div class="login-err" id="loginErr"></div>
    <button type="button" class="install-hint" id="installHint" title="把工作台装到手机或电脑桌面">📲 添加到桌面</button>
  </div>
</div>

<!-- 安装到桌面指引弹窗 -->
<div class="modal-mask" id="installModal" hidden>
  <div class="modal install-modal">
    <h2>📲 添加到手机 / 电脑桌面<span class="m-close" data-close-install>✕</span></h2>
    <div class="install-steps">
      <div class="install-block">
        <div class="ib-title">📱 手机</div>
        <p><b>iPhone（Safari）</b>：点底部「分享」<span class="ib-ic">⬆️</span> → 「添加到主屏幕」→ 添加。</p>
        <p><b>安卓（Chrome）</b>：点右上角「⋮」→ 「安装应用」或「添加到主屏幕」。</p>
      </div>
      <div class="install-block">
        <div class="ib-title">💻 电脑</div>
        <p><b>Chrome / Edge</b>：点地址栏右侧的安装图标 <span class="ib-ic">⊕</span>，或菜单 → 「投放到桌面 / 安装此站点」。</p>
      </div>
      <p class="install-note">添加后桌面会出现一个独立图标，点开即用，像 App 一样全屏，无需每次输网址。</p>
      <button type="button" class="btn primary block" id="installNow" hidden>一键安装到此设备</button>
    </div>
  </div>
</div>

<!-- 主应用 -->
<div id="app" hidden>
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="菜单">☰</button>
    <div class="brand" id="brand">
      <span class="brand-logo" id="brandLogo">🦢</span>
      <span class="brand-name" id="brandName">miao的工作台</span>
    </div>
    <div class="topbar-right">
      <span class="sync-dot" id="syncDot" title="同步状态"></span>
      <button class="icon-btn" id="logoutBtn" aria-label="退出">⎋</button>
    </div>
  </header>

  <nav class="sidebar" id="sidebar"></nav>
  <div class="drawer-mask" id="drawerMask"></div>

  <main class="main" id="main"></main>
</div>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="./app.js"></script>
</body>
</html>
