<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280">
  <!-- 浅色底纹：疗愈绿叶（用于浅色页面背景） -->
  <g fill="#2E9E8F" fill-opacity="0.06">
    <!-- 左上叶枝 -->
    <g transform="translate(24,36) rotate(-28)">
      <path d="M0,0 C16,-7 38,-9 58,0 C38,11 16,11 0,0 Z"/>
      <path d="M12,16 C26,9 46,9 62,18 C46,30 26,30 12,16 Z" transform="rotate(14 12 16)"/>
      <path d="M8,-18 C20,-27 38,-29 52,-22 C38,-11 20,-9 8,-18 Z"/>
    </g>
    <!-- 右中叶枝 -->
    <g transform="translate(216,120) rotate(150)">
