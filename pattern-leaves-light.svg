      <path d="M10,14 C22,8 40,8 54,16 C40,26 22,26 10,14 Z" transform="rotate(12 10 14)"/>
    </g>
    <!-- 中下单片叶 -->
    <g transform="translate(120,236) rotate(24)">
      <path d="M0,0 C12,-9 30,-11 42,-3 C30,9 12,11 0,0 Z"/>
    </g>
    <!-- 茎线 -->
    <g fill="none" stroke="#2E9E8F" stroke-opacity="0.05" stroke-width="1.6">
      <path d="M28,44 Q70,26 96,40"/>
      <path d="M212,126 Q190,150 176,168"/>
    </g>
  </g>
</svg>
